controller:
  serviceType: NodePort
  nodePort: 30003
  admin:
    username: admin
    password: admin123
  resources:
    requests:
      cpu: "300m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"
  javaOpts: "-Xms384m -Xmx768m"
  livenessProbe:
    initialDelaySeconds: 120

    periodSeconds: 20
    failureThreshold: 10
  readinessProbe:
    initialDelaySeconds: 60
    periodSeconds: 20
    failureThreshold: 10
  startupProbe:
    initialDelaySeconds: 60
    periodSeconds: 20
    failureThreshold: 30
  installPlugins:
    - kubernetes
    - workflow-aggregator
    - git
    - sonar
    - configuration-as-code
  JCasC:
    defaultConfig: true
    configScripts:
      moneymitra-bootstrap: |
        credentials:
          system:
            domainCredentials:
              - credentials:
                  - usernamePassword:
                      id: "sonar-admin-creds"
                      scope: GLOBAL
                      username: "admin"
                      password: "Shaurya@1234"
                      description: "SonarQube admin credentials for bootstrap pipeline"
persistence:
  enabled: true
  size: 8Gi
  storageClass: standard
