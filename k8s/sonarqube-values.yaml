# Ultra-Lightweight SonarQube for Hackathon
persistence:
  enabled: true
  size: 5Gi

# Reducing memory footprint
resources:
  requests:
    memory: "1.5Gi"
    cpu: "300m"
  limits:
    memory: "1.5Gi"
    cpu: "500m"

# JVM heap tuning (This is the most important part for stability)
jvmOpts: "-Xms512m -Xmx768m -XX:+UseParallelGC"

# Disabling heavy background initializations
initSysctl:
  enabled: true

# Correct setting for SonarQube Community Build
community:
  enabled: true

monitoringPasscode: "moneymitra123"

# Extra environment variables
extraEnv:
  - name: SONAR_SEARCH_JAVAOPTS
    value: "-Xms512m -Xmx512m -XX:+UseParallelGC"

# Increase startup probe time
startupProbe:
  initialDelaySeconds: 60
  periodSeconds: 10
  failureThreshold: 60